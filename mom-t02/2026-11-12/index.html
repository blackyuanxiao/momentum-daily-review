  <script>
  (() => {
    "use strict";
    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("loginUsername");
    const passwordInput = document.getElementById("loginPassword");
    const submit = document.getElementById("loginSubmit");
    const message = document.getElementById("loginMessage");
    const payload = JSON.parse(document.getElementById("protectedReport").textContent);
    let unlockedMaterial = null;
    let activePayload = payload;
    let workToken = 0;
    let pendingRequest = null;
    const supported = globalThis.crypto?.subtle && globalThis.TextEncoder && globalThis.TextDecoder && globalThis.DecompressionStream && globalThis.Blob && globalThis.Response;
    if (!supported) {
      message.textContent = "当前浏览器不支持安全解锁，请使用新版 Chrome、Edge 或 Safari。";
      submit.disabled = true;
    }
    function fromBase64(value) {
      if (typeof value !== "string" || !/^[A-Za-z0-9+/]*={0,2}$/.test(value) || value.length % 4 !== 0) throw new Error("INVALID_PAYLOAD");
      const binary = atob(value);
      return Uint8Array.from(binary, character => character.charCodeAt(0));
    }
    function validate(payload) {
      if (payload.schema_version !== "mom_i03_encrypted_payload_v1" || payload.template_version !== "1" || payload.kdf !== "PBKDF2-SHA256" || payload.iterations !== 600000 || payload.cipher !== "AES-256-GCM" || payload.tag_bits !== 128 || payload.compression !== "gzip") throw new Error("INVALID_PAYLOAD");
      if (!/^[0-9a-f]{64}$/.test(payload.plaintext_sha256) || !/^[0-9a-f]{64}$/.test(payload.login_template_sha256) || !Number.isInteger(payload.plaintext_bytes) || payload.plaintext_bytes <= 0 || payload.plaintext_bytes > 95000000) throw new Error("INVALID_PAYLOAD");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(payload.signal_date) || !/^\d{4}-\d{2}-\d{2}$/.test(payload.label_date)) throw new Error("INVALID_PAYLOAD");
    }
    function aad(payload) {
      return new TextEncoder().encode([payload.schema_version, payload.template_version, payload.login_template_sha256, payload.signal_date, payload.label_date, payload.plaintext_sha256, payload.plaintext_bytes].join("\0"));
    }
    async function digest(bytes) {
      return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), byte => byte.toString(16).padStart(2,"0")).join("");
    }
    async function decryptReport(payload, material) {
      validate(payload);
      const salt = fromBase64(payload.salt);
      const iv = fromBase64(payload.iv);
      const ciphertext = fromBase64(payload.ciphertext);
      if (salt.length !== 16 || iv.length !== 12 || ciphertext.length <= 16) throw new Error("INVALID_PAYLOAD");
      let compressed, plaintext;
      try {
        const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"}, material, {name:"AES-GCM", length:256}, false, ["decrypt"]);
        compressed = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv, additionalData:aad(payload), tagLength:128}, key, ciphertext));
        plaintext = new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
        if (plaintext.length !== payload.plaintext_bytes || await digest(plaintext) !== payload.plaintext_sha256) throw new Error("CONTENT_MISMATCH");
        return new TextDecoder("utf-8", {fatal:true}).decode(plaintext);
      } finally {
        compressed?.fill(0);
        plaintext?.fill(0);
      }
    }
    function forgetSession() {
      unlockedMaterial = null;
      ++workToken;
      pendingRequest?.abort();
      pendingRequest = null;
    }
    function renderReport(html, nextPayload) {
      activePayload = nextPayload;
      document.open();
      document.write(html);
      document.close();
      installLockControls();
    }
    function installLockControls() {
      const nav = document.createElement("nav");
      nav.id = "themeReportNav";
      nav.setAttribute("aria-label", "主题主线试跑");
      nav.style.cssText = "position:sticky;top:0;z-index:2147483647;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 16px;background:#f3f6f9;color:#24364b;border-bottom:1px solid #ccd6e1;font:14px/1.5 system-ui,-apple-system,sans-serif";
      const label = document.createElement("span");
      label.textContent = "主题主线试跑 · " + activePayload.signal_date;
      label.style.cssText = "margin:0;font-weight:600;flex:1";
      const logout = document.createElement("button");
      logout.id = "secureReportLogout";
      logout.type = "button";
      logout.textContent = "退出登录";
      logout.setAttribute("aria-label", "退出登录并锁定复盘");
      logout.style.cssText = "width:auto;min-height:36px;margin:0;padding:6px 14px;border:1px solid #bac6d3;border-radius:7px;background:#fff;color:#304d6a;font:inherit;cursor:pointer";
      logout.addEventListener("click", () => { forgetSession(); document.documentElement.style.visibility = "hidden"; location.reload(); });
      nav.append(label, logout);
      document.body.prepend(nav);
      // A restored page must never keep an unlocked report. Conceal and clear
      // its DOM before caching, then reload the encrypted page on restoration.
      window.addEventListener("pagehide", () => {
        forgetSession();
        document.documentElement.style.visibility = "hidden";
        document.body.replaceChildren();
      }, {capture:true});
      window.addEventListener("pageshow", event => {
        if (event.persisted) { forgetSession(); document.documentElement.style.visibility = "hidden"; location.reload(); }
      }, {capture:true});
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!supported || submit.disabled) return;
      submit.disabled = true;
      message.textContent = "正在解锁，请稍候…";
      let credentialBytes;
      try {
        validate(payload);
        const username = usernameInput.value;
        const password = passwordInput.value;
        if (!username || !password || username.includes("\0") || password.includes("\0")) throw new Error("INVALID_CREDENTIALS");
        credentialBytes = new TextEncoder().encode(username + "\0" + password);
        passwordInput.value = "";
        const material = await crypto.subtle.importKey("raw", credentialBytes, "PBKDF2", false, ["deriveKey"]);
        credentialBytes.fill(0);
        const html = await decryptReport(payload, material);
        unlockedMaterial = material;
        renderReport(html, payload);
      } catch (_) {
        forgetSession();
        message.textContent = "账号或密码不正确，或页面内容已损坏。请重试。";
        passwordInput.value = "";
        submit.disabled = false;
        passwordInput.focus();
      } finally {
        credentialBytes?.fill(0);
      }
    });
  })();
  </script>
